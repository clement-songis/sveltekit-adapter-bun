name: Release

# Publishes package.json's version to npm when it isn't there yet, and creates the GitHub
# release. Versions are `<upstream version>-ws.<n>`, see the README.
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'clement-songis/sveltekit-adapter-bun'
    permissions:
      contents: write # to create the release
      id-token: write # OpenID Connect token for npm trusted publishing and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # npm 11.5+ for trusted publishing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether the version is published
        id: version
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run test:e2e

      # `latest`: npm otherwise refuses to publish a prerelease version without a tag
      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --tag latest

      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --generate-notes
